services:
  - type: web
    name: school-erp-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: node server/server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
